apply plugin: 'com.android.application'

// Virtua Cop 3 VR for Meta Quest. quest/build.sh fills src/main/libs and the
// SDL Java sources before this runs.
android {
    namespace "org.vc3recomp"
    compileSdkVersion 35

    defaultConfig {
        applicationId "org.vc3recomp.vr"
        minSdkVersion 29
        targetSdkVersion 32
        versionCode((project.findProperty("appVersionCode") ?: "1") as int)
        versionName(project.findProperty("appVersionName") ?: "0.1.0")
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lintOptions { abortOnError false }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDir 'src/main/libs'
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    signingConfigs {
        // VC3_KEYSTORE signs a release; otherwise this machine's debug key.
        release {
            def ks = System.getenv("VC3_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("VC3_KEYSTORE_PASSWORD")
                keyAlias "vc3"
                keyPassword System.getenv("VC3_KEYSTORE_PASSWORD")
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
