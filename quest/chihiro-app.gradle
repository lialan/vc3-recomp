// A Chihiro game's Quest app: the Android side every game's module shares.
// The module (quest/<id>/build.gradle) sets appNamespace and appId -- its
// Java package and the package name, game.conf's NAMESPACE and PKG -- and
// applies this; quest/build.sh <id> fills its src/main/libs and the SDL Java
// sources first. -PappId / -PappNamespace (quest/build.sh passes game.conf's)
// win over the module's.
apply plugin: 'com.android.application'

android {
    namespace(providers.gradleProperty("appNamespace").getOrElse(project.ext.appNamespace))
    compileSdkVersion 35

    defaultConfig {
        applicationId(providers.gradleProperty("appId").getOrElse(project.ext.appId))
        manifestPlaceholders = [appLabel: project.findProperty("appLabel") ?: "@string/app_name",
                                requireGles: project.findProperty("requireGles") ?: "true"]
        minSdkVersion 29
        targetSdkVersion 32
        versionCode((project.findProperty("appVersionCode") ?: "1") as int)
        versionName(project.findProperty("appVersionName") ?: "0.1.0")
        ndk { abiFilters 'arm64-v8a' }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lintOptions { abortOnError false }

    sourceSets.main {
        jni.srcDirs = []
        jniLibs.srcDirs = [project.findProperty('nativeLibsDir') ?: 'src/main/libs']
    }

    packaging {
        jniLibs { useLegacyPackaging = true }
    }
    signingConfigs {
        // CHIHIRO_KEYSTORE (or VC3_KEYSTORE) signs a release; otherwise this
        // machine's debug key.
        release {
            def ks = System.getenv("CHIHIRO_KEYSTORE") ?: System.getenv("VC3_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword(System.getenv("CHIHIRO_KEYSTORE_PASSWORD") ?: System.getenv("VC3_KEYSTORE_PASSWORD"))
                keyAlias(System.getenv("CHIHIRO_KEY_ALIAS") ?: "vc3")
                keyPassword(System.getenv("CHIHIRO_KEYSTORE_PASSWORD") ?: System.getenv("VC3_KEYSTORE_PASSWORD"))
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
