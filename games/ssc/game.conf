# Silent Scope Complete's launcher (Konami; Xbox retail, 2004): the menu that
# starts Silent Scope 1, 2 or 3 (default.xbe). What scripts/ and quest/ need to
# know about it. Sourced by sh and bash; keep it plain assignments. (The
# runtime's own settings are in src/game.c.)

TITLE="Silent Scope Complete"
XBE=default.xbe                         # in the Silent Scope Complete folder
# the XBE the lifted code and the profile's addresses are for: lift.sh
# refuses another (US retail, XDK 5558, title 4B4E001A)
XBE_SHA256=a910f54f04cd572ad8b04659a47b1dd881ff58f15473c209b53bfd95eb30276c
ENV_PREFIX=SSC                          # SSC_FPS = CHIHIRO_FPS (ch_env.h)
GAME_DIR_DEFAULT="$HOME/Downloads/VR/SSC/extracted"   # unless $SSC_GAME_DIR
LIFT_FLAGS=--reg-cache                  # extra tools.recomp options, as VC3

# The Quest app (quest/build.sh, quest/<id> is its Gradle module). Each game
# is its own app beside it (org.sscrecomp.ss1..3): the menu starts them and
# they come back to it (launchSibling).
APP="Silent Scope Complete VR"
APK=SilentScopeCompleteVR
NAMESPACE=org.sscrecomp
PKG=org.sscrecomp.ssc
ACTIVITY=org.sscrecomp.SilentScopeCompleteVR
HEADSET_DIR=/sdcard/SilentScope              # the games' folder: one Silent Scope Complete folder
LOG=ssc.log
LOGTAG=ssc
RENDERER=vulkan                         # quest/build.sh: the shared Vulkan renderer (CHIHIRO_RENDERER unless given)
DATA_DIR=data_title                     # the folder install.sh checks beside the XBE (the menu reads data_title)
