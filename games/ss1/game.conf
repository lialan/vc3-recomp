# Silent Scope (Konami; Xbox retail, from Silent Scope Complete, 2004): what
# scripts/ and quest/ need to know about this game. Sourced by sh and bash;
# keep it plain assignments. (The runtime's own settings are in src/game.c.)

TITLE="Silent Scope"
XBE=ss1.xbe                             # in the Silent Scope Complete folder
# the XBE the lifted code and the profile's addresses are for: lift.sh
# refuses another (US retail, XDK 5558, built 2003-08-26, title 4B4E001A)
XBE_SHA256=3995fd4ad97be73eec1022039dcf711e42cb2ab681241993872743861f8872cd
ENV_PREFIX=SS1                          # SS1_FPS = CHIHIRO_FPS (ch_env.h)
GAME_DIR_DEFAULT="$HOME/Downloads/VR/SSC/extracted"   # unless $SS1_GAME_DIR
LIFT_FLAGS=--reg-cache                  # extra tools.recomp options, as VC3

# The Quest app (quest/build.sh, quest/<id> is its Gradle module)
APP="Silent Scope VR"
APK=SilentScopeVR
NAMESPACE=org.sscrecomp
PKG=org.sscrecomp.ss1
ACTIVITY=org.sscrecomp.SilentScopeVR
HEADSET_DIR=/sdcard/SilentScope
LOG=ss1.log
LOGTAG=ss1
RENDERER=vulkan                         # quest/build.sh: the shared Vulkan renderer (CHIHIRO_RENDERER unless given)
DATA_DIR=data1                          # the folder install.sh checks beside the XBE (ss1 reads data1)
