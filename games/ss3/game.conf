# Silent Scope 3 (Konami; Xbox retail, from Silent Scope Complete, 2004): what
# scripts/ and quest/ need to know about this game. Sourced by sh and bash;
# keep it plain assignments. (The runtime's own settings are in src/game.c.)

TITLE="Silent Scope 3"
XBE=ss3.xbe                             # in the Silent Scope Complete folder
# the XBE the lifted code and the profile's addresses are for: lift.sh
# refuses another (US retail, XDK 5558, built 2003-08-26, title 4B4E001A)
XBE_SHA256=e5d815a68204a85b3284f24ea0eefc22f84022efdf56e34e54860856a4f2928d
ENV_PREFIX=SS3                          # SS3_FPS = CHIHIRO_FPS (ch_env.h)
GAME_DIR_DEFAULT="$HOME/Downloads/VR/SSC/extracted"   # unless $SS3_GAME_DIR
LIFT_FLAGS=--reg-cache                  # extra tools.recomp options, as VC3

# The Quest app (quest/build.sh, quest/<id> is its Gradle module)
APP="Silent Scope 3 VR"
APK=SilentScope3VR
NAMESPACE=org.sscrecomp
PKG=org.sscrecomp.ss3
ACTIVITY=org.sscrecomp.SilentScope3VR
HEADSET_DIR=/sdcard/SilentScope              # ss1's: one Silent Scope Complete folder for the three
LOG=ss3.log
LOGTAG=ss3
RENDERER=vulkan                         # quest/build.sh: the shared Vulkan renderer (CHIHIRO_RENDERER unless given)
DATA_DIR=data3                          # the folder install.sh checks beside the XBE (ss3 reads data3)
