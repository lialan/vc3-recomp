# Virtua Cop 3 (Sega Chihiro, 2003): what scripts/ and quest/ need to know
# about this game. Sourced by sh and bash; keep it plain assignments.
# (The runtime's own settings are in src/game.c, the ChihiroProfile.)

TITLE="Virtua Cop 3"
XBE=vc3.xbe                             # the game, in its folder (with media/)
# the XBE the lifted code and the profile's addresses are for: lift.sh
# refuses another (VC3, Chihiro, XDK 5028, built 2003-02-26, debug-keyed)
XBE_SHA256=85fcc40d1653609d905906f15beb507057089d2be61eadc36fe369827580a7c8
ENV_PREFIX=VC3                          # VC3_FPS = CHIHIRO_FPS (ch_env.h)
GAME_DIR_DEFAULT="$HOME/Downloads/VR/VC3/extracted"   # the game's folder, unless $VC3_GAME_DIR
LIFT_FLAGS=--reg-cache                  # extra tools.recomp options

# The Quest app (quest/build.sh, quest/<id> is its Gradle module)
APP="Virtua Cop 3 VR"
APK=VirtuaCop3VR                        # quest/$APK.apk
NAMESPACE=org.vc3recomp
PKG=org.vc3recomp.vr
ACTIVITY=org.vc3recomp.VirtuaCop3VR
HEADSET_DIR=/sdcard/VirtuaCop3          # the game's files on the headset
DATA_DIR=media                          # the folder quest/install.sh checks beside the XBE
LOG=vc3.log                             # written there each run (profile id + .log)
LOGTAG=vc3                              # logcat tag (the profile's id)

# tests/vr_math_test.c: the game's projection as the back end recovers it
# (kx ky cx cy 1/pz) and its screen height
TEST_PROJ="-772.5f, 772.5f, 320.5f, 240.5f, -1.0f"
TEST_SCREEN_H=480.0f
