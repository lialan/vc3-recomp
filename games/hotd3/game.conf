# The House of the Dead III (Sega / Wow Entertainment; Sega Chihiro, 2002):
# what scripts/ and quest/ need to know about this game. Sourced by sh and
# bash; keep it plain assignments. (The runtime's own settings are in
# src/game.c, the ChihiroProfile.)

TITLE="The House of the Dead III"
XBE=hod3xb.xbe                          # the game, in its folder (with FS/ and MVI/)
# the XBE the lifted code and the profile's addresses are for: lift.sh
# refuses another. The one source is the Batocera v43 image's
# roms/chihiro/House Of the Dead 3.squashfs (Chihiro, XDK 4831, built
# 2002-10-29, debug-keyed); acdemoT.xbe beside it is the TestLaunch stub.
XBE_SHA256=89a0e7778002205c114a91bc1797291344b2afeea8b5c7d5085cce7e47dc71de
ENV_PREFIX=HOTD3                        # HOTD3_FPS = CHIHIRO_FPS (ch_env.h)
GAME_DIR_DEFAULT="$HOME/Downloads/VR/HOTD3/extracted"   # unless $HOTD3_GAME_DIR
LIFT_FLAGS=--reg-cache                  # extra tools.recomp options, as VC3

# The Quest app (quest/build.sh, quest/<id> is its Gradle module)
APP="House of the Dead III VR"
APK=HouseOfTheDead3VR
NAMESPACE=org.hotd3recomp
PKG=org.hotd3recomp.vr
ACTIVITY=org.hotd3recomp.HouseOfTheDead3VR
HEADSET_DIR=/sdcard/HouseOfTheDead3     # the game's files on the headset (hod3xb.xbe, FS/, MVI/; ~356 MB)
DATA_DIR=FS                             # the folder quest/install.sh checks beside the XBE
LOG=hotd3.log                           # written there each run (profile id + .log)
LOGTAG=hotd3                            # logcat tag (the profile's id)
RENDERER=vulkan                         # quest/build.sh: the shared Vulkan renderer (its VR needs it)
