# Silent Scope 2 (Konami; Xbox retail, from Silent Scope Complete, 2004): what
# scripts/ and quest/ need to know about this game. Sourced by sh and bash;
# keep it plain assignments. (The runtime's own settings are in src/game.c.)

TITLE="Silent Scope 2"
XBE=ss2.xbe                             # in the Silent Scope Complete folder
# the XBE the lifted code and the profile's addresses are for: lift.sh
# refuses another (US retail, XDK 5558, built 2003-08-26, title 4B4E001A)
XBE_SHA256=e09088023022cba43537f9fd86713096a552745aa98c8af9561c4d43f15c6502
ENV_PREFIX=SS2                          # SS2_FPS = CHIHIRO_FPS (ch_env.h)
GAME_DIR_DEFAULT="$HOME/Downloads/VR/SSC/extracted"   # unless $SS2_GAME_DIR
LIFT_FLAGS=--reg-cache                  # extra tools.recomp options, as VC3

# The Quest app (quest/build.sh): not built yet
APP="Silent Scope 2 VR"
APK=SilentScope2VR
NAMESPACE=org.sscrecomp
PKG=org.sscrecomp.ss2
ACTIVITY=org.sscrecomp.SilentScope2VR
HEADSET_DIR=/sdcard/SilentScope2
LOG=ss2.log
LOGTAG=ss2
